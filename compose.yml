# Lab / local Compose setup for the LMS API.
# Default admin credentials are DEVELOPMENT ONLY. Override them in production.

services:
  lms-db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lms-net

  lms-api:
    build: .
    container_name: lms-api
    restart: unless-stopped
    depends_on:
      lms-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@lms-db:5432/lms_db
      JWT_SECRET: change-me-in-class
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      # DEVELOPMENT DEFAULTS — change these for production
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: admin@123
      ADMIN_ROLE: admin
    networks:
      - lms-net

volumes:
  lms_pgdata:

networks:
  lms-net:
    name: lms-net
