services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lms-api

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@lms-db:5432/lms_db"
      JWT_SECRET: "bDXwmOpJMS2fz1M8O+Y34mMs+rCfvngdwKkO0yw4OQVYRII4saMGqcBfdFTP3n+XCIsa5i58A1V+ec5RK7dn6Q=="
      JWT_EXPIRES: "7d"
      CORS_ORIGIN: "http://localhost:3000"

    depends_on:
      - lms-db

    networks:
      - lms-net


  lms-db:
    image: postgres:16

    container_name: lms-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - lms-net


volumes:
  postgres_data:


networks:
  lms-net:
